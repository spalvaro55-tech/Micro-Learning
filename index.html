<!--
  Content-Security-Policy: capa extra de protección (además de las Reglas de Firestore/Storage).
  Limita desde qué dominios se puede cargar código y a cuáles se puede conectar — así, aunque en el
  futuro se colara algún texto no filtrado correctamente, el navegador igual bloquearía que ese
  código cargue recursos o envíe datos a un sitio ajeno a los que esta app realmente usa.
  Nota: se permite 'unsafe-inline' en script-src porque la app usa atributos onclick="" en cientos
  de botones (patrón usado en todo el archivo) — no bloquea ejecución inline, pero sí restringe
  fuertemente desde dónde se puede cargar/conectar cualquier recurso externo.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://www.gstatic.com https://www.google.com;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com;
  img-src 'self' data: blob: https://flagcdn.com https://*.supabase.co;
  connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://*.supabase.co https://cdn.jsdelivr.net wss://*.firebaseio.com;
  frame-src 'self' blob: https://www.google.com;
  object-src 'none';
  base-uri 'self';
">

<script>
/* ==========================================================================
   1) MODELO DE DATOS Y CAPA DE PERSISTENCIA (localStorage)
   ========================================================================== */
const STORAGE_KEY = 'tigo_microlearning_v5';
const SESSION_KEY  = 'tigo_microlearning_session_v5';
const MAX_TRAINERS_PER_COUNTRY = 4;
const LOW_PERFORMANCE_THRESHOLD = 60; // pts — umbral para marcar a un asesor como "en riesgo" en el dashboard
const MAX_ATTACHMENT_BYTES = 40 * 1024 * 1024; // 40MB — los adjuntos pesan se guardan en IndexedDB (no en localStorage), con margen amplio para PDF/PPT con imágenes o video incrustado

/* ==========================================================================
   1.1) ALMACÉN DE ARCHIVOS PESADOS (IndexedDB)
   Los documentos (PDF/PPT) se guardan como Blob en IndexedDB en vez de
   base64 en localStorage, lo que permite adjuntos mucho más grandes sin
   agotar la cuota de almacenamiento del navegador (localStorage ronda 5-10MB
   en total; IndexedDB admite decenas o cientos de MB según el dispositivo).
   ========================================================================== */
const IDB_NAME = 'tigo_microlearning_files';
const IDB_STORE = 'attachments';
function openFileDB(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB no disponible en este navegador')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbPutFile(key, blob){
  const db = await openFileDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(blob, key);
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>reject(tx.error);
  });
}
async function idbGetFile(key){
  if(!key) return null;
  const db = await openFileDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=>resolve(req.result || null);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbDeleteFile(key){
  if(!key) return;
  try{
    const db = await openFileDB();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = ()=>resolve(true);
      tx.onerror = ()=>reject(tx.error);
    });
  }catch(e){ console.warn('No se pudo eliminar adjunto de IndexedDB', e); }
}

/* ==========================================================================
   1.3) ARCHIVOS PESADOS EN LA NUBE (Supabase Storage)
   Envoltorio único que usa TODO el resto del código para guardar/leer/borrar
   adjuntos (PDF/PPT/audio). Se usa Supabase en vez de Firebase Storage porque
   Supabase ofrece almacenamiento de archivos gratis SIN pedir tarjeta de
   crédito (Firebase Storage empezó a exigirla desde 2026). Firestore sigue
   ocupándose de todo lo demás (asesores, progreso, módulos, comunicados),
   ya que esa parte de Firebase siempre fue — y sigue siendo — gratis.

   Si hay conexión a Supabase configurada, sube y descarga de ahí (así un
   entrenador sube un PDF desde su PC y un asesor lo ve desde su celular).
   Siempre mantiene además una copia en IndexedDB de este dispositivo como
   caché rápida / respaldo sin conexión.
   ========================================================================== */
async function storeAttachment(key, blob){
  try{ await idbPutFile(key, blob); }catch(e){ console.warn('No se pudo guardar la copia local del adjunto', e); }
  if(SUPABASE_ENABLED && supabaseClient){
    const { error } = await supabaseClient.storage.from(SUPABASE_BUCKET).upload(key, blob, { upsert:true, contentType: blob.type||undefined });
    if(error) throw error;
  }
}
async function fetchAttachment(key){
  if(!key) return null;
  if(SUPABASE_ENABLED && supabaseClient){
    try{
      const { data, error } = await supabaseClient.storage.from(SUPABASE_BUCKET).download(key);
      if(error) throw error;
      idbPutFile(key, data).catch(()=>{}); // refresca también la copia local
      return data;
    }catch(e){
      console.warn('No se pudo descargar el adjunto desde la nube, probando copia local del dispositivo:', e);
    }
  }
  return await idbGetFile(key);
}
async function removeAttachment(key){
  if(!key) return;
  idbDeleteFile(key);
  if(SUPABASE_ENABLED && supabaseClient){
    try{ const { error } = await supabaseClient.storage.from(SUPABASE_BUCKET).remove([key]); if(error) throw error; }
    catch(e){ console.warn('No se pudo eliminar el adjunto en la nube (puede que ya no exista):', e); }
  }
}
function formatFileSize(bytes){
  if(!bytes) return '';
  if(bytes < 1024*1024) return Math.round(bytes/1024) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }

/* ==========================================================================
   0.1) CONTRASEÑAS PROTEGIDAS (hash con sal, vía Web Crypto — nativo del navegador)
   Ninguna contraseña (Maestro, Entrenador/a, wave, personal del asesor) se
   guarda nunca en texto plano — ni en Firestore ni en localStorage. Se
   guarda solo un "hash" (una huella irreversible). Verificar una contraseña
   significa volver a calcular su huella y compararla, nunca leer la
   original. Así, aunque alguien lograra leer la base de datos directamente
   (saltándose la app), no obtendría contraseñas utilizables.
   Por diseño, esto significa que NADIE — ni el Maestro — puede "ver" de
   nuevo una contraseña ya guardada; solo se puede rotar (generar una nueva).
   ========================================================================== */
function randomSaltHex(){
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  return Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function sha256Hex(text){
  const data = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
/** Genera {salt, hash} a partir de una contraseña en texto plano — se llama SOLO al crear/rotar. */
async function hashPassword(plainPassword){
  const salt = randomSaltHex();
  const hash = await sha256Hex(salt + ':' + plainPassword);
  return { salt, hash };
}
/** Compara una contraseña ingresada contra un {salt, hash} guardado. Tolera contraseñas viejas sin proteger (migración). */
async function verifyPassword(plainPassword, stored){
  if(!stored) return false;
  if(typeof stored === 'string') return plainPassword === stored; // compatibilidad con datos previos a esta protección
  if(!stored.hash || !stored.salt) return false;
  const hash = await sha256Hex(stored.salt + ':' + plainPassword);
  return hash === stored.hash;
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){ const d = defaultState(); saveState(d); return d; }
    return ensureStateShape(JSON.parse(raw));
  }catch(e){ console.error('Error cargando estado', e); const d = defaultState(); saveState(d); return d; }
}
/**
 * Migración defensiva: si el estado guardado en el navegador viene de una versión anterior
 * de la plataforma y le faltan campos que se agregaron después (comunicados, historial de
 * intentos, audio en role-play, etc.), se completan aquí con valores por defecto en vez de
 * dejar que la app se rompa silenciosamente al acceder a un campo inexistente.
 */
function ensureStateShape(s){
  if(!s || typeof s!=='object') return defaultState();
  if(!s.meta) s.meta = { createdAt: Date.now() };
  if(!s.security) s.security = {};
  if(s.security.masterPassword && !s.security.masterPasswordHash){
    // Migración de una instalación anterior a la protección con hash: se conserva temporalmente
    // el texto plano viejo SOLO para que verifyPassword() lo siga aceptando hasta que se rote.
    s.security.masterPasswordHash = s.security.masterPassword;
    delete s.security.masterPassword;
  }
  if(s.security.masterPasswordHash===undefined) s.security.masterPasswordHash = null;
  if(!s.security.trainers) s.security.trainers = {};
  COUNTRIES.forEach((c,idx)=>{
    if(!s.security.trainers[c.code] || !s.security.trainers[c.code].length) s.security.trainers[c.code] = [defaultTrainerProfile(c.code,1)];
    s.security.trainers[c.code].forEach(t=>{
      if(t.password && !t.passwordHash){ t.passwordHash = t.password; delete t.password; }
      if(t.advisorPassword && !t.advisorPasswordHash){ t.advisorPasswordHash = t.advisorPassword; delete t.advisorPassword; }
      if(t.passwordHash===undefined) t.passwordHash = null;
      if(t.advisorPasswordHash===undefined) t.advisorPasswordHash = null;
    });
  });
  if(!s.trainerAnnouncements) s.trainerAnnouncements = {};
  if(!s.trainerAnnouncements.ALL) s.trainerAnnouncements.ALL = [];
  COUNTRIES.forEach(c=>{ if(!s.trainerAnnouncements[c.code]) s.trainerAnnouncements[c.code] = []; });
  if(!s.advisorAnnouncements) s.advisorAnnouncements = {};
  COUNTRIES.forEach(c=>{ if(!s.advisorAnnouncements[c.code]) s.advisorAnnouncements[c.code] = []; });
  if(!Array.isArray(s.modules)) s.modules = [];
  if(!Array.isArray(s.materials)) s.materials = [];
  if(!Array.isArray(s.sections)) s.sections = [];
  if(!Array.isArray(s.liveQuizHistory)) s.liveQuizHistory = [];
  if(!Array.isArray(s.liveQuizTemplates)) s.liveQuizTemplates = [];
  if(!Array.isArray(s.users)) s.users = [];
  s.users.forEach(u=>{
    if(u.personalPassword && !u.personalPasswordHash){ u.personalPasswordHash = u.personalPassword; delete u.personalPassword; }
    if(u.personalPasswordHash===undefined) u.personalPasswordHash = null;
  });
  if(!Array.isArray(s.cohortHistory)) s.cohortHistory = [];
  // Compatibilidad con módulos/materiales guardados antes de que existiera el control de habilitación del entrenador/a:
  // se dejan visibles por defecto para no ocultar de golpe contenido que ya estaba activo.
  s.modules.forEach(m=>{ if(m.releasedForAdvisors===undefined) m.releasedForAdvisors = true; if(m.sectionId===undefined) m.sectionId = null; });
  s.materials.forEach(mt=>{ if(mt.releasedForAdvisors===undefined) mt.releasedForAdvisors = true; });
  return s;
}

}

/**
 * Inicia sesión anónima automática (invisible para la persona) antes de tocar Firestore.
 * No reemplaza las contraseñas propias de la app (Maestro/Entrenador/Asesor) — esas se
 * mantienen igual. Esto solo le exige a Firestore que cualquier pedido venga acompañado
 * de una sesión válida de Firebase, para poder usar reglas de seguridad "allow if
 * request.auth != null" en vez de dejar la base totalmente abierta a quien tenga las claves.
 */
async function ensureFirebaseAuth(){
  if(typeof firebase.auth !== 'function') return; // SDK de Auth no cargó (sin internet, bloqueado, etc.)
  if(firebase.auth().currentUser) return;
  await firebase.auth().signInAnonymously();
  // Espera a que el propio SDK confirme (vía su listener interno) que la sesión anónima
  // quedó completamente activa antes de tocar Firestore — evita una carrera donde la
  // promesa de signInAnonymously() ya resolvió pero el token todavía no se adjunta a
  // los siguientes pedidos, lo que Firestore reporta como "permisos insuficientes".
  await new Promise(resolve=>{
    let unsub = null, done = false;
    function finish(){ if(done) return; done = true; if(unsub) unsub(); resolve(); }
    unsub = firebase.auth().onAuthStateChanged(u=>{ if(u) finish(); });
    setTimeout(finish, 4000); // salvaguarda: no esperar para siempre
  });
}

function subscribeToRemoteChanges(){
  if(unsubConfig) unsubConfig();
  unsubConfig = configDocRef.onSnapshot(snap=>{
    if(!snap.exists || snap.metadata.hasPendingWrites) return;
    const cfg = snap.data();
    Object.assign(DB, cfg);
    ensureStateShape(DB);
    saveState(DB);
    cloudSyncStatus = 'synced';
    render();
  }, err=>{ console.error('Error de sincronización (config):', err); cloudSyncStatus='error'; updateSyncBadge(); });

  if(unsubUsers) unsubUsers();
  unsubUsers = usersCollRef.onSnapshot(snap=>{
    snap.docChanges().forEach(change=>{
      if(change.doc.metadata.hasPendingWrites) return; // ignora el eco de nuestro propio guardado
      const u = change.doc.data();
      if(change.type==='removed'){
        DB.users = DB.users.filter(x=>x.id!==u.id);
      } else {
        const idx = DB.users.findIndex(x=>x.id===u.id);
        if(idx>=0) DB.users[idx] = u; else DB.users.push(u);
      }
    });
    saveState(DB);
    cloudSyncStatus = 'synced';
    render();
  }, err=>{ console.error('Error de sincronización (asesores):', err); cloudSyncStatus='error'; updateSyncBadge(); });

  if(unsubCohortHistory) unsubCohortHistory();
  unsubCohortHistory = cohortHistoryCollRef.onSnapshot(snap=>{
    snap.docChanges().forEach(change=>{
      if(change.doc.metadata.hasPendingWrites) return;
      const h = change.doc.data();
      if(change.type==='removed'){
        DB.cohortHistory = DB.cohortHistory.filter(x=>x.id!==h.id);
      } else {
        const idx = DB.cohortHistory.findIndex(x=>x.id===h.id);
        if(idx>=0) DB.cohortHistory[idx] = h; else DB.cohortHistory.push(h);
      }
    });
    saveState(DB);
    render();
  }, err=>{ console.error('Error de sincronización (historial):', err); });

  if(unsubLiveQuizHistory) unsubLiveQuizHistory();
  unsubLiveQuizHistory = liveQuizHistoryCollRef.onSnapshot(snap=>{
    snap.docChanges().forEach(change=>{
      if(change.doc.metadata.hasPendingWrites) return;
      const h = change.doc.data();
      if(change.type==='removed'){
        DB.liveQuizHistory = DB.liveQuizHistory.filter(x=>x.id!==h.id);
      } else {
        const idx = DB.liveQuizHistory.findIndex(x=>x.id===h.id);
        if(idx>=0) DB.liveQuizHistory[idx] = h; else DB.liveQuizHistory.push(h);
      }
    });
    saveState(DB);
    render();
  }, err=>{ console.error('Error de sincronización (historial de competencias):', err); });
}

async function initApp(){
  $app.innerHTML = `<div class="flex-1 flex items-center justify-center"><p class="text-slate-400 text-sm">Cargando...</p></div>`;
  if(FIREBASE_ENABLED && initFirestoreConnection()){
    try{
      await ensureFirebaseAuth();
      const configSnap = await configDocRef.get();
      if(configSnap.exists){
        DB = defaultState();
        Object.assign(DB, configSnap.data());
        ensureStateShape(DB);
      } else {
        DB = defaultState();
        await configDocRef.set(configSnapshotFromDB());
      }
      const usersSnap = await usersCollRef.get();
      DB.users = usersSnap.docs.map(d=>d.data());
      const historySnap = await cohortHistoryCollRef.get();
      DB.cohortHistory = historySnap.docs.map(d=>d.data());
      const liveQuizHistSnap = await liveQuizHistoryCollRef.get();
      DB.liveQuizHistory = liveQuizHistSnap.docs.map(d=>d.data());

      cloudSyncStatus = 'synced';
      saveState(DB);
      subscribeToRemoteChanges();
    }catch(e){
      console.error('No se pudo conectar a la base de datos compartida, usando almacenamiento local:', e);
      if(e && e.code === 'permission-denied'){
        console.error('DIAGNÓSTICO: Firestore rechazó el pedido por permisos. Revisa en Firebase → Firestore Database → Reglas que el bloque "allow read, write: if request.auth != null;" esté PUBLICADO (no solo pegado), y en Authentication → Sign-in method que "Anonymous" esté Activado.');
      }
      DB = loadState();
      cloudSyncStatus = 'error';
    }
  } else {
    DB = loadState();
  }
  if(SUPABASE_ENABLED && initSupabaseConnection()){
    try{ await ensureSupabaseAuth(); }
    catch(e){ console.error('No se pudo conectar a Supabase Storage, los adjuntos quedarán solo en este dispositivo:', e); }
  }
  if(SESSION.currentUserId && !DB.users.find(u=>u.id===SESSION.currentUserId)){ SESSION = {}; }
  if(!SESSION.screen){ SESSION.screen = 'entry'; }
  render();
}

/** Un módulo está disponible para el asesor si el entrenador/a (o Maestro) lo habilitó explícitamente.
 *  Ya no depende de haber completado el módulo anterior: el ritmo de avance lo decide quien capacita. */
function isModuleUnlocked(mod){
  return mod.releasedForAdvisors !== false;
}

function userOverallProgress(user, modList){
  modList = modList || sortedModulesForUser(user);
  if(modList.length===0) return {pct:0, avgScore:0, completedCount:0};
  let completed=0, scoreSum=0, scoreCount=0, weightedSum=0, weightTotal=0;
  modList.forEach(m=>{
    const p = user.progress[m.id];
    if(p && p.completed){
      completed++; scoreSum += (p.score||0); scoreCount++;
      const w = Number(m.weight)||0;
      weightedSum += (p.score||0) * w; weightTotal += w;
    }
  });
  // Score académico: promedio ponderado por la ponderación (%) configurada en cada módulo.
  // Si los módulos completados no tienen ponderación definida, se usa el promedio simple como respaldo.
  const avgScore = weightTotal>0 ? Math.round(weightedSum/weightTotal) : (scoreCount? Math.round(scoreSum/scoreCount) : 0);
  return { pct: Math.round((completed/modList.length)*100), avgScore, completedCount: completed };
}

function usersInScope(country, trainerId){
  return DB.users.filter(u=> (country==null || u.country===country) && (trainerId==null || u.trainerId===trainerId) );

}
/** Gráfica de pastel SVG hecha a mano (sin librerías externas) para comparar Waves/entrenadores u otras categorías. */
const PIE_COLORS = ['#001EB4','#00005A','#2E9BD6','#1FA35C','#F2A93B','#E14B4B','#C6960C','#5C77D6','#7FB8E8','#6B4FA0'];
function pieChartSVG(data){
  data = (data||[]).filter(d=>d.value>0);
  if(data.length===0) return '<p class="text-sm text-slate-400 text-center py-6">Sin datos suficientes para graficar.</p>';
  const total = data.reduce((s,d)=>s+d.value,0);
  const cx=60, cy=60, r=55;
  let angleStart = -90;
  const slices = data.map((d,i)=>{
    const angleSize = (d.value/total)*360;
    const angleEnd = angleStart + angleSize;
    const largeArc = angleSize>180? 1:0;
    const x1 = cx + r*Math.cos(angleStart*Math.PI/180), y1 = cy + r*Math.sin(angleStart*Math.PI/180);
    const x2 = cx + r*Math.cos(angleEnd*Math.PI/180), y2 = cy + r*Math.sin(angleEnd*Math.PI/180);
    const path = data.length===1
      ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${PIE_COLORS[i%PIE_COLORS.length]}"/>`
      : `<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${largeArc} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${PIE_COLORS[i%PIE_COLORS.length]}"/>`;
    angleStart = angleEnd;
    return path;
  }).join('');
  const legend = data.map((d,i)=>`
    <div class="flex items-center gap-2 text-xs">
      <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${PIE_COLORS[i%PIE_COLORS.length]}"></span>
      <span class="text-slate-600 truncate flex-1">${escapeHTML(d.label)}</span>
      <span class="text-slate-400 shrink-0">${Math.round(d.value/total*100)}%</span>
    </div>`).join('');
  return `
    <div class="flex flex-col items-center gap-4">
      <svg viewBox="0 0 120 120" class="w-36 h-36">${slices}</svg>
      <div class="w-full space-y-1.5">${legend}</div>
    </div>`;
}
function escapeHTML(str){ return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toast(msg, kind){
  kind = kind || 'ok';
  const colors = { ok:'bg-ok text-white', bad:'bg-bad text-white', warn:'bg-warn text-white' };
  const el = document.createElement('div');
  el.className = `fixed bottom-5 left-1/2 -translate-x-1/2 z-[100] px-5 py-3 rounded-xl shadow-pop font-display text-sm font-semibold ${colors[kind]} fade-in`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s ease'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2400);
}

/* ==========================================================================
   3) EXPORTACIÓN DE RESULTADOS (Excel vía SheetJS, con respaldo CSV)
   ========================================================================== */
function buildResultsRows(country, trainerId, usersOverride){
  const users = usersOverride || usersInScope(country, trainerId);
  const modList = modulesForScope(country===null? null : country).filter(m=>m.enabled);
  return users.map(u=>{
    const st = userOverallProgress(u, sortedModulesForUser(u));
    const row = {
      'Nombre': u.nombre, 'Apellido': u.apellido, 'ID Colaborador': u.colaboradorId,
      'País': countryName(u.country), 'Entrenador/a': trainerLabel(u.country, u.trainerId),
      'Fecha de registro': new Date(u.createdAt).toLocaleDateString('es-BO'),
      'Compromiso aceptado': hasAcceptedCommitment(u) ? 'Sí (' + new Date(u.commitment.acceptedAt).toLocaleDateString('es-BO') + ')' : 'No',
      'Avance (%)': st.pct, 'Score Promedio': st.avgScore,
    };
    modList.forEach(m=>{
      const p = u.progress[m.id];
      row[m.title + ' (score)'] = p && p.completed ? p.score : '';
      row[m.title + ' (intentos)'] = p && p.completed ? p.attempts : '';
      row[m.title + ' (estado)'] = p && p.completed ? 'Completado' : 'Pendiente';
    });
    return row;
  });
}
function exportResults(country, trainerId, labelSuffix, usersOverride){
  const rows = buildResultsRows(country, trainerId, usersOverride);
  if(!rows.length){ toast('No hay asesores en este alcance para exportar', 'warn'); return; }
  const filename = 'Resultados_Tigo_' + (labelSuffix||'wave') + '_' + new Date().toISOString().slice(0,10);
  if(typeof XLSX !== 'undefined'){
    try{
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Resultados');
      XLSX.writeFile(wb, filename + '.xlsx');
      toast('Excel exportado correctamente', 'ok');
      return;
    }catch(e){ console.error(e); }
  }
  // Respaldo CSV si SheetJS no cargó (ej. sin conexión al CDN)
  const headers = Object.keys(rows[0]);
  const csv = [headers.join(',')].concat(rows.map(r=>headers.map(h=>`"${String(r[h]??'').replace(/"/g,'""')}"`).join(','))).join('\n');
  const blob = new Blob(['\ufeff'+csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename + '.csv'; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Excel no disponible sin conexión: se exportó en CSV (se abre en Excel)', 'warn');
}

function navigate(screen, params){

function render(){
  const screen = SESSION.screen || 'entry';
  try{
    switch(screen){
      case 'entry': renderEntryScreen(); break;
      case 'country': renderCountryScreen(); break;
      case 'trainerWhoAmI': renderTrainerWhoAmI(); break;
      case 'trainerGate': renderTrainerGate(); break;

      case 'advisorWhoIsTrainer': renderAdvisorWhoIsTrainer(); break;
      case 'userOnboarding': renderUserOnboarding(); break;
      case 'userPasswordGate': renderUserPasswordGate(); break;
      case 'commitmentGate': renderCommitmentGate(); break;
      case 'setPersonalPassword': renderSetPersonalPasswordScreen(); break;
      case 'userHome': renderUserHome(); break;
      case 'materialsLibrary': renderMaterialsLibrary(); break;
      case 'advisorReport': renderAdvisorReport(); break;
      case 'competenciaHost': renderCompetenciaHost(); break;
      case 'competenciaJoin': renderCompetenciaJoin(); break;
      case 'competenciaPlay': renderCompetenciaPlay(); break;
      case 'modulePlayer': renderModulePlayer(SESSION.params.moduleId); break;
      default: renderEntryScreen();
    }
    updateSyncBadge();
  }catch(e){
    // Salvaguarda: si una pantalla falla por datos inesperados, no se queda "congelada" sin avisar.
    console.error('Error de render en pantalla "'+screen+'":', e);
    toast('Ocurrió un problema al mostrar esta pantalla. Volviendo al inicio.', 'bad');
    SESSION.screen = 'entry'; SESSION.params = {}; saveSession(SESSION);
    try{ renderEntryScreen(); }catch(e2){ console.error(e2); }
  }
}

      <p class="text-sm text-slate-500 mt-1 mb-5">${isFirstTime? 'Primera vez: crea la contraseña que usarás de ahora en adelante. Nadie más la puede ver una vez guardada — solo tú, o la puedes rotar si la olvidas.' : 'Visión corporativa de las seis operaciones.'}</p>
      <input id="master-pass" type="password" placeholder="${isFirstTime? 'Crea tu contraseña maestra':'Contraseña maestra'}" class="field" onkeydown="if(event.key==='Enter')${isFirstTime? 'setInitialMasterPassword()':'tryMasterLogin()'}">
      ${isFirstTime? `<input id="master-pass-confirm" type="password" placeholder="Repite la contraseña" class="field mt-2" onkeydown="if(event.key==='Enter')setInitialMasterPassword()">` : ''}
      <p id="master-pass-error" class="text-bad text-xs mt-2 hidden"></p>
      <button class="btn btn-master w-full py-3 rounded-full mt-5" onclick="${isFirstTime? 'setInitialMasterPassword()':'tryMasterLogin()'}">${isFirstTime? 'Crear y entrar':'Ingresar'}</button>
    </div>
  </div>
  ${footerHTML()}`;
}
async function tryMasterLogin(){
  const val = document.getElementById('master-pass').value.trim();
  const ok = await verifyPassword(val, DB.security.masterPasswordHash);
  if(ok){
    SESSION.isMaster = true; saveSession(SESSION);
    navigate('masterHome');
  } else {
    document.getElementById('master-pass-error').textContent = 'Contraseña incorrecta.';
    document.getElementById('master-pass-error').classList.remove('hidden');
  }
}
async function setInitialMasterPassword(){
  const val = document.getElementById('master-pass').value.trim();
  const val2 = document.getElementById('master-pass-confirm').value.trim();
  const errEl = document.getElementById('master-pass-error');
  if(val.length<6){ errEl.textContent='Usa al menos 6 caracteres.'; errEl.classList.remove('hidden'); return; }
  if(val!==val2){ errEl.textContent='Las contraseñas no coinciden.'; errEl.classList.remove('hidden'); return; }
  DB.security.masterPasswordHash = await hashPassword(val);
  persist();
  SESSION.isMaster = true; saveSession(SESSION);
  toast('Contraseña Maestro creada. Guárdala en un lugar seguro — no se puede volver a ver.', 'ok');
  navigate('masterHome');
}
function logoutMaster(){ SESSION.isMaster=false; saveSession(SESSION); navigate('entry'); }

/* ==========================================================================
   12) DASHBOARD ANALÍTICO (compartido Maestro / Entrenador) + Exportación
   ========================================================================== */
function dashboardHTML(scopeCountry, isMasterView, scopeTrainerId){
  const users = usersInScope(scopeCountry, scopeTrainerId);
  const modList = modulesForScope(scopeCountry).filter(m=>m.enabled);
  const totalUsers = users.length;

  let avgPct=0, avgScore=0;
  if(totalUsers>0){
    let pctSum=0, scoreSum=0, scoreN=0;
    users.forEach(u=>{
      const st = userOverallProgress(u, sortedModulesForUser(u));
      pctSum += st.pct;
      if(st.completedCount>0){ scoreSum += st.avgScore; scoreN++; }
    });
    avgPct = Math.round(pctSum/totalUsers);
    avgScore = scoreN? Math.round(scoreSum/scoreN) : 0;
  }

  const funnel = modList.map(m=>({ mod:m, completedCount: users.filter(u=> u.progress[m.id] && u.progress[m.id].completed).length }));
  const maxFunnel = Math.max(1, totalUsers);
  const dropOff = funnel.length? funnel.reduce((worst,cur)=> cur.completedCount < worst.completedCount? cur: worst, funnel[0]) : null;

  const byCountry = COUNTRIES.map(c=>({ ...c, count: DB.users.filter(u=>u.country===c.code).length })).filter(c=>c.count>0);

  // Desglose por entrenador (siempre visible para el Maestro; útil para comparar waves)
  let trainerRows = [];
  const countriesForBreakdown = isMasterView ? (scopeCountry? [scopeCountry] : COUNTRIES.map(c=>c.code)) : [scopeCountry];
  countriesForBreakdown.forEach(code=>{
    trainersOfCountry(code).forEach(t=>{
      const tUsers = DB.users.filter(u=>u.country===code && u.trainerId===t.id);
      if(tUsers.length===0 && isMasterView===false) return; // en vista entrenador, solo su propia fila tiene sentido
      let pctSum=0, scoreSum=0, scoreN=0;
      tUsers.forEach(u=>{ const st = userOverallProgress(u, sortedModulesForUser(u)); pctSum+=st.pct; if(st.completedCount>0){scoreSum+=st.avgScore; scoreN++;} });
      trainerRows.push({ country:code, trainer:t, count:tUsers.length, avgPct: tUsers.length? Math.round(pctSum/tUsers.length):0, avgScore: scoreN? Math.round(scoreSum/scoreN):0 });
    });
  });
  if(!isMasterView) trainerRows = trainerRows.filter(r=>r.trainer.id===scopeTrainerId);

  // Asesores en riesgo: score bajo con al menos un módulo completado, o sin ningún avance (posible abandono)
  const lowPerformers = users
    .map(u=>({ u, st: userOverallProgress(u) }))
    .filter(({u, st})=> (st.completedCount>0 && st.avgScore < LOW_PERFORMANCE_THRESHOLD) || (st.completedCount===0 && (Date.now()-u.createdAt) > 3*24*60*60*1000))
    .sort((a,b)=> a.st.avgScore - b.st.avgScore);

  const exportLabel = isMasterView ? (scopeCountry? (scopeTrainerId? countryName(scopeCountry)+'_'+trainerLabel(scopeCountry,scopeTrainerId) : countryName(scopeCountry)) : 'Corporativo') : countryName(scopeCountry)+'_'+trainerLabel(scopeCountry,scopeTrainerId);

  return `
  <div class="fade-in space-y-7">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <p class="font-display font-bold text-tigo-900 text-lg">${isMasterView? 'Dashboard corporativo' : 'Dashboard de mi wave'}</p>
      <div class="flex flex-wrap items-center gap-2">
        ${isMasterView? countryFilterSelectHTML(scopeCountry, 'setDashboardFilter') : ''}
        ${isMasterView && scopeCountry ? trainerFilterSelectHTML(scopeCountry, scopeTrainerId, 'setDashboardTrainerFilter') : ''}
        <button class="btn btn-primary px-4 py-2 rounded-full text-xs" onclick="exportResults(${scopeCountry? `'${scopeCountry}'`:'null'}, ${scopeTrainerId? `'${scopeTrainerId}'`:'null'}, '${exportLabel.replace(/[^a-zA-Z0-9_]/g,'')}')">⬇️ Exportar resultados</button>
      </div>
    </div>

    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
      ${kpiCard('Asesores registrados', totalUsers, '👥', 'text-tigo-900')}
      ${kpiCard('Avance promedio', avgPct+'%', '📈', 'text-tigo-cyan-600')}
      ${kpiCard('Score promedio', avgScore+' pts', '🎯', avgScore>=70?'text-ok':'text-warn')}
      ${kpiCard('Módulos activos', modList.length, '🧩', 'text-tigo-900')}
    </div>

    ${lowPerformers.length? `
    <div class="card p-6 border border-bad/20">
      <p class="font-display font-bold text-bad mb-1">⚠️ Asesores en riesgo (${lowPerformers.length})</p>
      <p class="text-xs text-slate-400 mb-4">Score bajo el umbral de ${LOW_PERFORMANCE_THRESHOLD} pts, o sin avance tras más de 3 días registrados. Prioriza el seguimiento con ellos.</p>
      <div class="space-y-2">
        ${lowPerformers.slice(0,8).map(({u,st})=>`
          <div class="flex items-center justify-between gap-3 border-b border-slate-50 py-2">
            <div class="min-w-0">
              <p class="text-sm font-medium text-slate-700 truncate">${escapeHTML(u.nombre)} ${escapeHTML(u.apellido)} <span class="text-slate-400 font-normal">· ${escapeHTML(u.colaboradorId)}</span></p>
              <p class="text-xs text-slate-400">${isMasterView? countryName(u.country)+' · ':''}${escapeHTML(trainerLabel(u.country,u.trainerId))} ${st.completedCount===0? '· Sin avance registrado' : '· '+st.avgScore+' pts promedio'}</p>
            </div>
            <button class="btn btn-ghost px-3 py-1.5 rounded-full text-xs shrink-0" onclick="navigate('advisorReport',{scopeCountry:${scopeCountry?`'${scopeCountry}'`:'null'}, scopeTrainerId:${scopeTrainerId?`'${scopeTrainerId}'`:'null'}, advisorId:'${u.id}'})">Ver detalle</button>
          </div>`).join('')}
      </div>
      ${lowPerformers.length>8? `<p class="text-xs text-slate-400 mt-3">+${lowPerformers.length-8} adicionales — usa el buscador en «Detalle por asesor» para ubicarlos.</p>`:''}
    </div>` : ''}

    <div class="grid lg:grid-cols-3 gap-5">
      <div class="card p-6 lg:col-span-2">
        <p class="font-display font-bold text-tigo-900 mb-1">Embudo de avance por módulo</p>
        <p class="text-xs text-slate-400 mb-5">Asesores que completaron cada módulo, en orden de la ruta.</p>
        <div class="space-y-4">
          ${funnel.map(f=>`
            <div>
              <div class="flex justify-between text-sm mb-1">
                <span class="font-medium text-slate-700">${moduleIcon(f.mod.type)} ${escapeHTML(f.mod.title)}</span>
                <span class="text-slate-400">${f.completedCount}/${totalUsers}</span>
              </div>
              <div class="progress-track h-3"><div class="progress-fill" style="width:${totalUsers? (f.completedCount/maxFunnel*100):0}%"></div></div>
            </div>
          `).join('') || '<p class="text-sm text-slate-400">Aún no hay módulos activos.</p>'}
        </div>
        ${dropOff && totalUsers>0 ? `<p class="text-xs text-slate-400 mt-5">⚠️ Mayor punto de deserción detectado: <span class="font-semibold text-bad">${escapeHTML(dropOff.mod.title)}</span></p>` : ''}
      </div>

      <div class="card p-6">
        <p class="font-display font-bold text-tigo-900 mb-1">${isMasterView? 'Distribución por operación':'Cobertura de la operación'}</p>
        <p class="text-xs text-slate-400 mb-5">${isMasterView? 'Asesores registrados por país.' : 'Resumen de tu wave activa.'}</p>
        ${isMasterView? `
        <div class="space-y-3">
          ${byCountry.length? byCountry.map(c=>`
            <div class="flex items-center gap-3">
              <span class="flag-circle" style="width:2.25rem;height:2.25rem;${flagCircleStyle(c.code)}"></span>
              <div class="flex-1">
                <div class="flex justify-between text-xs mb-1"><span class="font-medium text-slate-600">${c.name}</span><span class="text-slate-400">${c.count}</span></div>
                <div class="progress-track h-2"><div class="progress-fill" style="width:${DB.users.length? (c.count/DB.users.length*100):0}%"></div></div>
              </div>
            </div>
          `).join('') : '<p class="text-sm text-slate-400">Sin registros aún.</p>'}
        </div>` : `
        <div class="flex flex-col items-center text-center py-4">
          <span class="flag-circle mb-3" style="${flagCircleStyle(scopeCountry)}"></span>
          <p class="font-display font-bold text-tigo-900">${countryName(scopeCountry)}</p>
          <p class="text-xs text-slate-400 mt-1">${totalUsers} asesores en tu wave activa</p>
        </div>`}
      </div>
    </div>

    ${isMasterView? `
    <div class="grid lg:grid-cols-3 gap-5">
      <div class="card p-6 lg:col-span-2">
        <p class="font-display font-bold text-tigo-900 mb-1">Resultados por entrenador/a (Waves)</p>
        <p class="text-xs text-slate-400 mb-4">Comparativo del desempeño de cada perfil de entrenador/a. Visible solo para el perfil Maestro.</p>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead><tr class="text-left text-slate-400 border-b border-slate-100">
              <th class="py-2 pr-4">Entrenador/a</th><th class="py-2 pr-4">País</th><th class="py-2 pr-4">Asesores</th><th class="py-2 pr-4">Avance</th><th class="py-2 pr-4">Score</th><th class="py-2 pr-4">Señal</th>
            </tr></thead>
            <tbody>
              ${trainerRows.length? trainerRows.map(r=>`
                <tr class="border-b border-slate-50">
                  <td class="py-2 pr-4 font-medium text-slate-700">${escapeHTML(r.trainer.name)}${!r.trainer.active?' <span class="chip bg-slate-200 text-slate-500 ml-1">Inactivo</span>':''}</td>
                  <td class="py-2 pr-4">${countryFlag(r.country)} ${countryName(r.country)}</td>
                  <td class="py-2 pr-4">${r.count}</td><td class="py-2 pr-4">${r.avgPct}%</td><td class="py-2 pr-4">${r.avgScore} pts</td>
                  <td class="py-2 pr-4">${signalBarsHTML(r.avgScore)}</td>
                </tr>`).join('') : `<tr><td colspan="6" class="py-6 text-center text-slate-400">Sin datos aún.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
      <div class="card p-6">
        <p class="font-display font-bold text-tigo-900 mb-1">Comparativo de Waves</p>
        <p class="text-xs text-slate-400 mb-4">Distribución de asesores por wave (gráfica de pastel).</p>
        ${pieChartSVG(trainerRows.filter(r=>r.count>0).map(r=>({ label: r.trainer.name+' ('+countryName(r.country)+')', value: r.count })))}
      </div>
    </div>` : ''}

    <div class="card p-6">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <p class="font-display font-bold text-tigo-900">Detalle por asesor</p>
        <div class="flex flex-wrap items-center gap-2">
          ${isMasterView? `<select class="field text-sm max-w-[180px]" id="users-country-filter" onchange="filterUsersTable()">
            <option value="">🌎 Todos los países</option>
            ${COUNTRIES.map(c=>`<option value="${c.code}">${c.name}</option>`).join('')}
          </select>` : ''}
          <input id="users-search-input" placeholder="Buscar por nombre o ID..." class="field max-w-xs text-sm" oninput="filterUsersTable()">
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm" id="users-table">
          <thead>
            <tr class="text-left text-slate-400 border-b border-slate-100">
              <th class="py-2 pr-4">Asesor</th><th class="py-2 pr-4">ID Colaborador</th>${isMasterView?'<th class="py-2 pr-4">País</th>':''}<th class="py-2 pr-4">Entrenador/a</th>
              <th class="py-2 pr-4">Avance</th><th class="py-2 pr-4">Score</th><th class="py-2 pr-4">Señal</th><th class="py-2 pr-4">Compromiso</th><th class="py-2 pr-4"></th>
            </tr>

          <tbody>
            ${users.length? users.map(u=>{
              const st = userOverallProgress(u);
              const accepted = hasAcceptedCommitment(u);
              const commitmentCell = accepted
                ? `<span class="chip bg-ok/10 text-ok" title="${new Date(u.commitment.acceptedAt).toLocaleString('es-BO')}">✅ Aceptado</span>`

              return `<tr class="border-b border-slate-50" data-search="${escapeHTML((u.nombre+' '+u.apellido+' '+u.colaboradorId).toLowerCase())}" data-country="${u.country}">
                <td class="py-2 pr-4 font-medium text-slate-700">${escapeHTML(u.nombre)} ${escapeHTML(u.apellido)}</td>
                <td class="py-2 pr-4 text-slate-500">${escapeHTML(u.colaboradorId)}</td>
                ${isMasterView? `<td class="py-2 pr-4">${countryFlag(u.country)} ${countryName(u.country)}</td>`:''}

function kpiCard(label, value, icon, colorClass){

    <p class="text-2xl font-display font-extrabold ${colorClass}">${value}</p>

  </div>`;

function filterUsersTable(){
  const searchEl = document.getElementById('users-search-input');
  const countryEl = document.getElementById('users-country-filter');
  const q = searchEl? searchEl.value.toLowerCase() : '';
  const country = countryEl? countryEl.value : '';
  document.querySelectorAll('#users-table tbody tr[data-search]').forEach(tr=>{
    const matchesText = tr.dataset.search.includes(q);
    const matchesCountry = !country || tr.dataset.country===country;
    tr.style.display = (matchesText && matchesCountry) ? '' : 'none';
  });
}

function moveModuleScoped(id, dir, scopeCountry){
  const list = modulesForScope(scopeCountry);
  const idx = list.findIndex(m=>m.id===id);
  const swapIdx = idx+dir;
  if(idx<0 || swapIdx<0 || swapIdx>=list.length) return;
  if(!canEditModule(list[idx]) || !canEditModule(list[swapIdx])) return;
  const tmp = list[idx].order; list[idx].order = list[swapIdx].order; list[swapIdx].order = tmp;
  persist(); render();
}
function toggleModule(id){
  const m = DB.modules.find(m=>m.id===id); if(!canEditModule(m)) return;
  m.enabled = !m.enabled; persist(); render();
}
function toggleModuleReleased(id){
  const m = DB.modules.find(m=>m.id===id); if(!canEditModule(m)) return;
  m.releasedForAdvisors = m.releasedForAdvisors===false ? true : false;
  persist(); render();
  toast(m.releasedForAdvisors? 'Módulo habilitado para los asesores':'Módulo oculto para los asesores', 'ok');
}

function createSection(){
  const title = document.getElementById('new-section-title').value.trim();
  if(!title){ toast('Ponle un nombre a la sección', 'warn'); return; }
  const country = document.getElementById('new-section-country').value;
  const maxOrder = DB.sections.reduce((mx,s)=>Math.max(mx,s.order),0);
  DB.sections.push({ id: uid('sec'), country, title, order: maxOrder+1, createdAt: Date.now() });
  persist(); closeModal(); render();

}
function renameSection(id){
  const sec = DB.sections.find(s=>s.id===id);
  if(!sec) return;
  openModal(`
    <p class="font-display font-bold text-tigo-900 text-lg mb-4">Renombrar sección</p>

function saveSectionRename(id){

function confirmDeleteSection(id){
  const sec = DB.sections.find(s=>s.id===id);
  if(!sec) return;
  const count = DB.modules.filter(m=>m.sectionId===id).length;
  openModal(`
    <p class="font-display font-bold text-tigo-900 text-lg mb-2">Eliminar sección</p>
    <p class="text-sm text-slate-500 mb-6">${count>0? `Sus ${count} módulo(s) NO se eliminan, solo quedarán "Sin sección".` : 'No tiene módulos asignados.'} ¿Confirmas eliminar "${escapeHTML(sec.title)}"?</p>

      <button class="btn btn-ghost px-4 py-2 rounded-full text-sm" onclick="closeModal()">Cancelar</button>
      <button class="btn px-4 py-2 rounded-full text-sm bg-bad text-white" onclick="deleteSection('${id}')">Eliminar</button>
    </div>`);
}
function deleteSection(id){
  DB.modules.forEach(m=>{ if(m.sectionId===id) m.sectionId = null; });
  DB.sections = DB.sections.filter(s=>s.id!==id);
  persist(); closeModal(); render();
  toast('Sección eliminada', 'ok');
}
function releaseSectionModules(sectionId, released){
  DB.modules.forEach(m=>{ if(m.sectionId===sectionId && canEditModule(m)) m.releasedForAdvisors = released; });
  persist(); render();
  toast(released? 'Toda la sección quedó habilitada para los asesores':'Toda la sección quedó oculta para los asesores', 'ok');
}
function confirmDeleteModule(id){

function deleteModule(id){
  const m = DB.modules.find(m=>m.id===id); if(!canEditModule(m)) return;
  DB.modules = DB.modules.filter(m=>m.id!==id);
  persist(); closeModal(); render(); toast('Módulo eliminado', 'ok');
}
function cloneModuleToMyCountry(id){
  const role = currentActorRole(); if(role!=='trainer') return;
  const original = DB.modules.find(m=>m.id===id);
  const maxOrder = DB.modules.reduce((mx,m)=>Math.max(mx,m.order),0);
  const clone = JSON.parse(JSON.stringify(original));
  clone.id = uid('m'); clone.order = maxOrder+1; clone.country = SESSION.country;
  clone.title = original.title + ' (copia personalizada)';
  clone.sectionId = null; // la sección del original puede no existir en el país de destino
  DB.modules.push(clone);
  persist(); render();
  toast('Módulo duplicado a tu país. Ya puedes personalizarlo.', 'ok');
  openEditModuleModal(clone.id);
}

function createModule(type){
  const role = currentActorRole();
  const defaultCountry = role==='trainer' ? SESSION.country : 'ALL';
  const maxOrder = DB.modules.reduce((mx,m)=>Math.max(mx,m.order),0);
  const base = { id: uid('m'), order:maxOrder+1, type, enabled:true, country:defaultCountry, weight:15, title:'Nuevo módulo sin título', description:'', sectionId:null, releasedForAdvisors:true };
  if(type==='quiz' || type==='evaluation') base.content = { passingScore:70, requiresPrevious: type==='evaluation', timeLimitMinutes:0, shuffleQuestions:false, shuffleOptions:false, questions:[] };
  else if(type==='case') base.content = { intro:'', steps:[], finalFeedbackSuccess:'' };
  else if(type==='roleplay') base.content = { scenario:'', cards:[] };
  else if(type==='flashcards') base.content = { cards:[] };
  DB.modules.push(base);
  persist(); closeModal();
  openEditModuleModal(base.id);
}

async function saveModuleEdits(id){
  const m = DB.modules.find(m=>m.id===id);
  const role = currentActorRole();
  m.title = document.getElementById('edit-title').value.trim() || m.title;
  m.description = document.getElementById('edit-desc').value.trim();

  else if(role==='trainer' && !m.country) m.country = SESSION.country;
  m.weight = Number(document.getElementById('edit-weight').value)||0;
  const sectionEl = document.getElementById('edit-section');
  if(sectionEl) m.sectionId = sectionEl.value || null;

  const saveBtn = document.querySelector('#modal-root .btn-primary');
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Guardando...'; }

  if(m.type==='quiz' || m.type==='evaluation') collectQuizEditor(m);
  else if(m.type==='case') collectCaseEditor(m);
  else if(m.type==='roleplay') await collectRoleplayEditor(m);

function handleRoleplayAudioChange(input, cardId){
  const file = input.files[0];
  if(!file) return;
  if(file.size > MAX_ATTACHMENT_BYTES){
    toast('El audio supera ' + formatFileSize(MAX_ATTACHMENT_BYTES) + '.', 'warn');
    input.value = ''; return;
  }
  PENDING_AUDIO_FILES[cardId] = { name:file.name, type:file.type, size:file.size, blob:file, removed:false };
  const info = input.parentElement.querySelector('.rp-audio-info');
  if(info) info.textContent = '🔊 Audio listo: ' + file.name + ' (' + formatFileSize(file.size) + ')';
}
function removeRoleplayAudio(btn){
  const cardRow = btn.closest('[data-cardid]');
  const cardId = cardRow.dataset.cardid;
  PENDING_AUDIO_FILES[cardId] = { removed:true };
  cardRow.querySelector('.rp-audio-info').textContent = 'El audio se eliminará al guardar.';
  btn.remove();
}
async function collectRoleplayEditor(m){
  m.content.scenario = document.getElementById('rp-scenario').value.trim();
  const rows = document.querySelectorAll('#rp-cards-list [data-cardrow]');
  const newCards = [];
  for(const row of rows){
    const cardId = row.dataset.cardid;
    const situation = row.querySelector('.rp-situation').value.trim();
    const clientLine = row.querySelector('.rp-clientline').value.trim();
    const optBlocks = [...row.querySelectorAll('.rp-options > div')];
    const options = optBlocks.map(b=>({ text: b.querySelector('.rp-op-text').value.trim(), isBest: b.querySelector('.rp-isbest').checked, feedback: b.querySelector('.rp-op-fb').value.trim() }));

    const existing = (m.content.cards||[]).find(c=>c.id===cardId);
    let audioRef = existing? existing.audioRef : null, audioName = existing? existing.audioName : '', audioType = existing? existing.audioType : '', audioSize = existing? existing.audioSize : 0;
    const pending = PENDING_AUDIO_FILES[cardId];
    if(pending && pending.removed){
      if(audioRef) removeAttachment(audioRef);
      audioRef=null; audioName=''; audioType=''; audioSize=0;
    } else if(pending && pending.blob){
      const oldRef = audioRef;
      audioRef = uid('aud');
      try{ await storeAttachment(audioRef, pending.blob); }catch(e){ console.error(e); toast('No se pudo guardar el audio de una tarjeta','bad'); audioRef = oldRef; }
      audioName = pending.name; audioType = pending.type; audioSize = pending.size;
      if(oldRef && oldRef!==audioRef) removeAttachment(oldRef);
    }
    newCards.push({ id: cardId, situation, clientLine, audioRef, audioName, audioType, audioSize, options });
  }
  m.content.cards = newCards;
  PENDING_AUDIO_FILES = {};
}

function handleMaterialFileChange(input){
  const file = input.files[0];

    input.value = ''; return;
  }
  // Se guarda la referencia al archivo (Blob) en memoria; se escribe en IndexedDB recién al Guardar.
  PENDING_MATERIAL_FILE = { name:file.name, type:file.type, size:file.size, blob:file, removed:false };
  const info = document.getElementById('mat-file-info');
  if(info) info.textContent = '📎 Archivo listo: ' + file.name + ' (' + formatFileSize(file.size) + ')';

async function saveMaterial(id){
  const role = currentActorRole();
  const title = document.getElementById('mat-title').value.trim();
  if(!title){ toast('El título es obligatorio', 'warn'); return; }
  const category = document.getElementById('mat-category').value;
  const country = role==='master' ? document.getElementById('mat-country').value : SESSION.country;
  const body = document.getElementById('mat-body').value.trim();
  const resourceUrl = document.getElementById('mat-url').value.trim();
  const existing = id ? DB.materials.find(mt=>mt.id===id) : null;
  const oldFileRef = existing ? existing.fileRef : null;

  const saveBtn = document.getElementById('mat-save-btn');
  let fileRef, fileName, fileType, fileSize;

  try{
    if(PENDING_MATERIAL_FILE && PENDING_MATERIAL_FILE.removed){
      fileRef=null; fileName=''; fileType=''; fileSize=0;
    } else if(PENDING_MATERIAL_FILE){
      if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Guardando archivo...'; }
      fileRef = uid('att');
      await storeAttachment(fileRef, PENDING_MATERIAL_FILE.blob);
      fileName = PENDING_MATERIAL_FILE.name; fileType = PENDING_MATERIAL_FILE.type; fileSize = PENDING_MATERIAL_FILE.size;
    } else if(existing){
      fileRef = existing.fileRef; fileName = existing.fileName; fileType = existing.fileType; fileSize = existing.fileSize;
    } else {
      fileRef=null; fileName=''; fileType=''; fileSize=0;
    }
  }catch(e){
    console.error(e);
    const detail = (e && (e.message || (e.error && e.error.message))) ? (e.message || e.error.message) : '';
    toast('No se pudo guardar el archivo adjunto' + (detail? ': '+detail : ' (revisa la consola del navegador con F12 para más detalle).'), 'bad');
    if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = 'Guardar material'; }
    return;
  }

  if(existing){
    Object.assign(existing, { title, category, country, body, resourceUrl, fileRef, fileName, fileType, fileSize });
  } else {
    DB.materials.push({ id: uid('mat'), title, category, country, body, resourceUrl, fileRef, fileName, fileType, fileSize, releasedForAdvisors:true, authorRole: role, createdAt: Date.now() });
  }
  // Limpieza: si se reemplazó o quitó un adjunto anterior y ningún otro material lo referencia, se borra.
  if(oldFileRef && oldFileRef!==fileRef && !DB.materials.some(mt=>mt.fileRef===oldFileRef)){
    removeAttachment(oldFileRef);
  }
  PENDING_MATERIAL_FILE = null;
  persist(); closeModal(); render();
  toast('Material guardado correctamente', 'ok');
}

    <p class="text-sm text-slate-500 mb-6">¿Confirmas eliminar <span class="font-semibold">${escapeHTML(mt.title)}</span>? Esta acción no se puede deshacer.</p>

async function closeCohort(country, trainerId){
  const trainer = findTrainer(country, trainerId);
  const leavingUsers = DB.users.filter(u=>u.country===country && u.trainerId===trainerId);
  DB.users = DB.users.filter(u=> !(u.country===country && u.trainerId===trainerId));
  leavingUsers.forEach(u=>deleteUserRemote(u.id));
  const entry = { id: uid('ch'), country, trainerId, trainerName: trainer.name, closedAt: Date.now(), users: leavingUsers };
  DB.cohortHistory.push(entry);
  const newPlainPassword = 'ASESOR-' + country + '-' + randomSaltHex().slice(0,8).toUpperCase();
  trainer.advisorPasswordHash = await hashPassword(newPlainPassword);
  persist(); persistCohortHistoryEntry(entry); closeModal(); render();
  showOneTimePasswordModal('Wave clausurada', 'Nueva contraseña generada para el siguiente grupo de '+trainer.name+'.', newPlainPassword);

/* ==========================================================================
   17.1) RESPALDO Y RESTAURACIÓN COMPLETA (independiente de la nube)
   Copia de seguridad manual en un archivo .json que el Maestro guarda en su
   propia computadora — un seguro extra ante cualquier problema con Firebase,
   Supabase, GitHub, o un error humano (ej. un reinicio accidental).
   No incluye los archivos adjuntos pesados (esos viven en Supabase Storage).
   ========================================================================== */
function downloadFullBackup(){
  const backup = { backupVersion: 1, createdAt: Date.now(), data: DB };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'Respaldo_Tigo_Microlearning_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Respaldo descargado correctamente', 'ok');
}
function handleRestoreBackupFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    let parsed;
    try{ parsed = JSON.parse(e.target.result); }
    catch(err){ toast('El archivo no es un respaldo válido (JSON dañado)', 'bad'); input.value=''; return; }
    const data = parsed && parsed.data ? parsed.data : parsed; // admite tanto el formato con envoltorio como el DB "crudo"
    if(!data || !Array.isArray(data.users) || !Array.isArray(data.modules)){
      toast('El archivo no tiene el formato esperado de un respaldo de esta plataforma', 'bad'); input.value=''; return;
    }
    confirmRestoreBackup(data, parsed.createdAt);
  };
  reader.onerror = ()=> toast('No se pudo leer el archivo', 'bad');
  reader.readAsText(file);
  input.value = '';
}
let PENDING_RESTORE_DATA = null;
function confirmRestoreBackup(data, createdAt){
  PENDING_RESTORE_DATA = data;
  const dateLabel = createdAt? new Date(createdAt).toLocaleString('es-BO') : 'fecha desconocida';
  openModal(`
    <p class="font-display font-bold text-bad text-lg mb-2">⚠️ Restaurar desde respaldo</p>
    <p class="text-sm text-slate-500 mb-4">Este respaldo es del <span class="font-semibold">${dateLabel}</span> y contiene <span class="font-semibold">${data.users.length}</span> asesores y <span class="font-semibold">${data.modules.length}</span> módulos. Esto REEMPLAZARÁ todos los datos actuales (incluida la nube compartida) por los del respaldo. No se puede deshacer.</p>
    <label class="text-xs font-semibold text-slate-500">Escribe <span class="font-mono text-bad">RESTAURAR</span> para confirmar</label>
    <input class="field mt-1" id="restore-backup-confirm" placeholder="RESTAURAR">
    <div class="flex justify-end gap-2 mt-5">
      <button class="btn btn-ghost px-4 py-2 rounded-full text-sm" onclick="closeModal()">Cancelar</button>
      <button class="btn px-4 py-2 rounded-full text-sm bg-bad text-white" onclick="executeRestoreBackup()">Restaurar</button>
    </div>`);
}
async function executeRestoreBackup(){
  const val = (document.getElementById('restore-backup-confirm').value||'').trim();
  if(val !== 'RESTAURAR'){ toast('Escribe RESTAURAR para confirmar', 'warn'); return; }
  if(!PENDING_RESTORE_DATA){ toast('No hay un respaldo cargado', 'bad'); return; }
  const data = ensureStateShape(PENDING_RESTORE_DATA);
  PENDING_RESTORE_DATA = null;
  DB = data;
  saveState(DB);
  if(FIREBASE_ENABLED && configDocRef){
    try{
      await configDocRef.set(configSnapshotFromDB());
      // Reemplaza la colección de asesores en la nube por la del respaldo
      const existingSnap = await usersCollRef.get();
      await Promise.all(existingSnap.docs.map(d=>d.ref.delete()));
      await Promise.all(DB.users.map(u=>usersCollRef.doc(u.id).set(u)));
      const existingHist = await cohortHistoryCollRef.get();
      await Promise.all(existingHist.docs.map(d=>d.ref.delete()));
      await Promise.all(DB.cohortHistory.map(h=>cohortHistoryCollRef.doc(h.id).set(h)));
      const existingLiveQuizHist = await liveQuizHistoryCollRef.get();
      await Promise.all(existingLiveQuizHist.docs.map(d=>d.ref.delete()));
      await Promise.all(DB.liveQuizHistory.map(h=>liveQuizHistoryCollRef.doc(h.id).set(h)));
    }catch(e){ console.error('Error restaurando en la nube:', e); toast('Se restauró localmente, pero hubo un problema sincronizando con la nube', 'warn'); }
  }
  closeModal();
  toast('Respaldo restaurado correctamente', 'ok');
  navigate('entry');
}

      <button class="btn btn-primary w-full py-3 rounded-full mt-5" onclick="tryUserPassword()">Ingresar a mi ruta</button>
    </div>
  </div>

async function tryUserPassword(){
  const val = document.getElementById('cohort-pass').value.trim();
  const p = SESSION.pendingUser;
  const trainer = findTrainer(p.country, p.trainerId);
  if(!trainer){ document.getElementById('cohort-pass-error').classList.remove('hidden'); return; }
  if(!trainer.advisorPasswordHash){
    document.getElementById('cohort-pass-error').textContent = 'Tu entrenador/a todavía no configuró la contraseña de esta wave.';
    document.getElementById('cohort-pass-error').classList.remove('hidden'); return;
  }
  const existingUser = DB.users.find(u=> u.colaboradorId.toLowerCase()===p.colaboradorId.toLowerCase() && u.country===p.country);
  // Si el asesor ya se creó una contraseña personal, esa es la que vale; si no, se usa la de su wave (compartida por el entrenador/a).
  const expectedHash = (existingUser && existingUser.personalPasswordHash) ? existingUser.personalPasswordHash : trainer.advisorPasswordHash;
  const ok = await verifyPassword(val, expectedHash);
  if(!ok){
    document.getElementById('cohort-pass-error').textContent = 'Contraseña incorrecta. Verifica con tu entrenador/a.';
    document.getElementById('cohort-pass-error').classList.remove('hidden'); return;
  }
  let user = existingUser;
  if(!user){
    user = { id: uid('u'), nombre:p.nombre, apellido:p.apellido, colaboradorId:p.colaboradorId, country:p.country, trainerId:p.trainerId, progress:{}, personalPasswordHash:null, personalPasswordPromptShown:false, createdAt:Date.now() };
    DB.users.push(user);
  } else {
    user.trainerId = p.trainerId; // permite re-asignación si vuelve a registrarse con otro entrenador/a
  }
  persistUser(user);
  SESSION.currentUserId = user.id;
  delete SESSION.pendingUser;
  saveSession(SESSION);
  navigateAfterLogin(user);
}
/** Decide la siguiente pantalla tras un login exitoso: compromiso pendiente → contraseña personal (una sola vez) → ruta. */
function navigateAfterLogin(user){
  if(!hasAcceptedCommitment(user)){ navigate('commitmentGate'); return; }
  if(!user.personalPasswordHash && !user.personalPasswordPromptShown){ navigate('setPersonalPassword'); return; }
  navigate('userHome');
}

/** Agrupa los módulos de la ruta del asesor por sección (creadas por el entrenador/a), en el orden de la sección
 *  y luego el orden interno de cada módulo. Los módulos sin sección quedan bajo "General" al final. */
function groupedModulesHTML(user, modList){
  const sections = sectionsForScope(user.country);
  const bySection = {};
  const noSection = [];
  modList.forEach(m=>{
    if(m.sectionId && sections.some(s=>s.id===m.sectionId)){
      (bySection[m.sectionId] = bySection[m.sectionId] || []).push(m);
    } else {
      noSection.push(m);
    }
  });
  const moduleRowHTML = (m, idx)=>{
    const prog = user.progress[m.id];
    const unlocked = isModuleUnlocked(m);
    const completed = prog && prog.completed;
    const retryExempt = m.type==='flashcards'; // las flashcards son de práctica libre, no cuentan intentos
    const canRetry = retryExempt || canAttemptModule(user, m);
    const clickable = unlocked && (!completed || canRetry);
    let statusChip;
    if(completed && !canRetry) statusChip = `<span class="chip bg-warn/10 text-warn">Completado · ${prog.score} pts · sin más intentos</span>`;
    else if(completed) statusChip = `<span class="chip bg-ok/10 text-ok">Completado · ${prog.score} pts${prog.attempts>1? ' · Intento '+prog.bestAttemptNumber+'/'+prog.attempts : ''}</span>`;
    else if(unlocked) statusChip = `<span class="chip bg-tigo-cyan-500/10 text-tigo-cyan-600">Disponible</span>`;
    else statusChip = `<span class="chip bg-slate-200 text-slate-500">Aún no habilitado</span>`;
    return `
    <button class="card p-5 w-full flex items-center gap-4 text-left ${clickable? 'hover:shadow-pop':'opacity-60 cursor-not-allowed'}" ${clickable?`onclick="navigate('modulePlayer',{moduleId:'${m.id}'})"`:''}>
      <div class="w-11 h-11 rounded-xl bg-tigo-700/10 flex items-center justify-center text-xl shrink-0">${moduleIcon(m.type)}</div>
      <div class="flex-1 min-w-0">
        <div class="flex flex-wrap items-center gap-2"><p class="font-display font-semibold text-tigo-900">${idx+1}. ${escapeHTML(m.title)}</p>${statusChip}</div>
        <p class="text-sm text-slate-500 mt-0.5">${escapeHTML(m.description||'')}</p>
      </div>
      ${clickable? `<span class="text-tigo-cyan-500 text-lg shrink-0">→</span>` : '<span class="text-lg shrink-0">🔒</span>'}
    </button>`;
  };
  if(modList.length===0) return '<p class="text-sm text-slate-400">No hay módulos disponibles para tu operación.</p>';
  const sectionBlocks = sections
    .filter(sec=>bySection[sec.id] && bySection[sec.id].length)
    .map(sec=>`
      <div class="space-y-3">
        <p class="font-display font-semibold text-tigo-700 text-sm uppercase tracking-wide">${escapeHTML(sec.title)}</p>
        ${bySection[sec.id].map((m,i)=>moduleRowHTML(m,i)).join('')}
      </div>`).join('');
  const generalBlock = noSection.length? `
    <div class="space-y-3">
      ${sectionBlocks? `<p class="font-display font-semibold text-tigo-700 text-sm uppercase tracking-wide">General</p>` : ''}
      ${noSection.map((m,i)=>moduleRowHTML(m,i)).join('')}
    </div>` : '';
  return sectionBlocks + generalBlock;
}

    ${actions}
  </div>`;
}
async function loadMaterialAttachmentInto(areaId, mt){
  try{
    const blob = await fetchAttachment(mt.fileRef);
    if(!blob) throw new Error('Adjunto no encontrado');
    if(CURRENT_PREVIEW_OBJECT_URL){ URL.revokeObjectURL(CURRENT_PREVIEW_OBJECT_URL); }
    CURRENT_PREVIEW_OBJECT_URL = URL.createObjectURL(blob);
    const area = document.getElementById(areaId);
    if(!area) return;
    area.innerHTML = attachmentPreviewHTML(mt, CURRENT_PREVIEW_OBJECT_URL);
  }catch(e){
    console.error(e);
    const area = document.getElementById(areaId);
    if(area) area.innerHTML = `<p class="text-xs text-bad mt-5">No se pudo cargar el archivo adjunto.</p>`;
  }
}

function simpleHash(str){
  let h = 5381;
  for(let i=0;i<str.length;i++){ h = ((h*33) ^ str.charCodeAt(i)) >>> 0; }
  return h.toString(36).toUpperCase();
}

function completeModule(user, m, scorePct, detail){
  const prev = user.progress[m.id] || { attemptsHistory: [] };
  const history = prev.attemptsHistory || [];
  const attemptNumber = history.length + 1;
  const roundedScore = Math.round(scorePct);
  history.push({ attempt: attemptNumber, score: roundedScore, completedAt: Date.now() });
  // El score "oficial" (usado en dashboard, avance ponderado y desbloqueo) es el MEJOR intento —
  // se premia la mejora, pero se conserva el historial completo de cada intento para revisión.
  const bestAttempt = history.reduce((best,a)=> a.score>best.score? a : best, history[0]);
  user.progress[m.id] = {
    completed:true, score: bestAttempt.score, bestAttemptNumber: bestAttempt.attempt, attempts: attemptNumber,
    extraAttemptsGranted: prev.extraAttemptsGranted||0, // se conserva: lo controla el entrenador/Maestro, no se resetea solo
    timeSpentSec: Math.round((Date.now()-PLAYER_STATE.startedAt)/1000), completedAt: Date.now(),
    detail: detail||null, attemptsHistory: history
  };
  persistUser(user);
  return { attemptNumber, roundedScore, bestAttempt };
}
/** Cuántos intentos totales tiene permitidos: 1 por defecto + los que el entrenador/Maestro haya habilitado de más. */
function allowedAttemptsFor(user, moduleId){
  const prog = user.progress[moduleId];
  return 1 + ((prog && prog.extraAttemptsGranted) || 0);
}
/** ¿Puede el asesor intentar (o volver a intentar) este módulo ahora mismo? */
function canAttemptModule(user, mod){
  const prog = user.progress[mod.id];
  if(!prog || !prog.completed) return true; // primer intento, siempre permitido
  return (prog.attempts||0) < allowedAttemptsFor(user, mod.id);
}

      <button class="btn btn-primary px-8 py-3 rounded-full" onclick="navigate('userHome')">Volver a mi ruta</button>
    </div>
  </div>`;
}
function shuffleArray(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function clearQuizTimer(){
  if(PLAYER_STATE.timerInterval){ clearInterval(PLAYER_STATE.timerInterval); PLAYER_STATE.timerInterval = null; }
}
function clearPlayerAudio(){
  if(PLAYER_STATE.audioObjectURLs){ PLAYER_STATE.audioObjectURLs.forEach(u=>URL.revokeObjectURL(u)); }
}

/* ---- Quiz / Evaluación (con configuración estilo formulario: tiempo límite y orden aleatorio) ---- */
function renderQuizPlayer(user, m){
  clearQuizTimer();
  let questions = (m.content.questions || []).map(q=>({...q, options:[...q.options]}));
  if(m.content.shuffleQuestions) questions = shuffleArray(questions);
  if(m.content.shuffleOptions){
    questions = questions.map(q=>{
      const correctText = q.options[q.correctIndex];
      const shuffledOptions = shuffleArray(q.options);
      return { ...q, options: shuffledOptions, correctIndex: shuffledOptions.indexOf(correctText) };
    });
  }
  PLAYER_STATE.questions = questions;
  PLAYER_STATE.qIndex = 0; PLAYER_STATE.correctCount = 0; PLAYER_STATE.totalQ = questions.length;
  PLAYER_STATE.answers = []; PLAYER_STATE.autoSubmitted = false;
  playerShell(m, ''); renderQuizQuestion(user, m);

  if(m.content.timeLimitMinutes>0){
    PLAYER_STATE.deadline = Date.now() + m.content.timeLimitMinutes*60000;
    const badge = document.getElementById('quiz-timer-badge');
    if(badge) badge.classList.remove('hidden');
    updateQuizTimer();
    PLAYER_STATE.timerInterval = setInterval(updateQuizTimer, 1000);
  }
}
function updateQuizTimer(){
  const badge = document.getElementById('quiz-timer-badge');
  if(!badge){ clearQuizTimer(); return; }
  const remainingMs = PLAYER_STATE.deadline - Date.now();
  if(remainingMs <= 0){
    badge.textContent = '⏱ 00:00';
    clearQuizTimer();
    if(!PLAYER_STATE.autoSubmitted){
      PLAYER_STATE.autoSubmitted = true;
      toast('⏱ Tiempo agotado. Tu evaluación fue enviada automáticamente.', 'warn');
      finalizeQuiz(currentUser(), DB.modules.find(mm=>mm.id===PLAYER_STATE.moduleId));
    }
    return;
  }
  const mm = Math.floor(remainingMs/60000), ss = Math.floor((remainingMs%60000)/1000);
  badge.textContent = '⏱ ' + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  if(remainingMs < 60000){ badge.classList.remove('bg-white','text-bad'); badge.classList.add('bg-bad','text-white'); } // último minuto: alerta visual
}
function renderQuizQuestion(user, m){
  const questions = PLAYER_STATE.questions || [];
  const i = PLAYER_STATE.qIndex;
  if(i >= questions.length){ return finalizeQuiz(user, m); }
  const q = questions[i];
  const body = document.getElementById('player-body');
  body.innerHTML = `
    <div class="mb-4">
      <div class="progress-track h-2 mb-2"><div class="progress-fill" style="width:${(i/questions.length)*100}%"></div></div>
      <p class="text-xs text-slate-400">Pregunta ${i+1} de ${questions.length}</p>
    </div>
    <div class="card p-6">
      <p class="font-display font-semibold text-tigo-900 mb-4">${escapeHTML(q.text)}</p>
      <div class="space-y-2" id="quiz-options">${q.options.map((op,oi)=>`<button class="op-btn w-full" onclick="answerQuiz(${oi})">${escapeHTML(op)}</button>`).join('')}</div>
      <p id="quiz-feedback" class="text-sm mt-4 hidden"></p>
      <button id="quiz-next" class="btn btn-primary px-6 py-2.5 rounded-full mt-5 hidden" onclick="nextQuizQuestion()">Continuar →</button>
    </div>`;
}
function answerQuiz(selectedIndex){
  const q = PLAYER_STATE.questions[PLAYER_STATE.qIndex];
  const options = document.querySelectorAll('#quiz-options .op-btn');
  const correct = selectedIndex === q.correctIndex;
  options.forEach((btn,idx)=>{ btn.classList.add('disabled'); if(idx===q.correctIndex) btn.classList.add('correct'); else if(idx===selectedIndex) btn.classList.add('incorrect'); });
  if(correct) PLAYER_STATE.correctCount++;
  PLAYER_STATE.answers.push({ questionText:q.text, selectedText:q.options[selectedIndex], correctText:q.options[q.correctIndex], isCorrect:correct });
  const fb = document.getElementById('quiz-feedback');
  fb.textContent = correct? (q.feedbackCorrect||'¡Correcto!') : (q.feedbackIncorrect||'No es correcto.');
  fb.className = 'text-sm mt-4 font-medium ' + (correct? 'text-ok':'text-bad');
  document.getElementById('quiz-next').classList.remove('hidden');
}
function nextQuizQuestion(){
  PLAYER_STATE.qIndex++;
  renderQuizQuestion(currentUser(), DB.modules.find(m=>m.id===PLAYER_STATE.moduleId));
}
function finalizeQuiz(user, m){
  clearQuizTimer();
  // Preguntas no respondidas (por tiempo agotado) se registran como incorrectas para el detalle de revisión
  const questions = PLAYER_STATE.questions || [];
  for(let i=PLAYER_STATE.answers.length; i<questions.length; i++){
    const q = questions[i];
    PLAYER_STATE.answers.push({ questionText:q.text, selectedText:'(sin responder)', correctText:q.options[q.correctIndex], isCorrect:false });
  }
  const scorePct = PLAYER_STATE.totalQ? (PLAYER_STATE.correctCount/PLAYER_STATE.totalQ*100) : 0;
  const passed = scorePct >= (m.content.passingScore||70);
  const attemptInfo = completeModule(user, m, scorePct, { type:'quiz', answers: PLAYER_STATE.answers, autoSubmitted: !!PLAYER_STATE.autoSubmitted });
  document.getElementById('player-body').innerHTML = resultScreenHTML(m, scorePct, passed, `
    <p class="text-xs text-slate-400 mt-3">${PLAYER_STATE.correctCount} de ${PLAYER_STATE.totalQ} respuestas correctas &middot; Puntaje mínimo requerido: ${m.content.passingScore||70} pts</p>
    ${PLAYER_STATE.autoSubmitted? '<p class="text-xs text-bad mt-1">⏱ Enviado automáticamente por tiempo agotado.</p>' : ''}
    ${m.type==='evaluation' ? `<div class="mt-4 p-3 rounded-lg ${passed?'bg-ok/10':'bg-warn/10'}"><p class="text-sm font-semibold ${passed?'text-ok':'text-warn'}">${passed? '🏁 Certificación de ruta alcanzada.' : 'Aún no alcanzas el puntaje mínimo. Coordina un refuerzo con tu entrenador/a.'}</p></div>` : ''}`, attemptInfo, canAttemptModule(user, m));
}

/* ---- Simulador de caso — mapa conceptual de pasos con feedback inmediato ---- */
function caseMapHTML(totalSteps, currentIndex){
  if(totalSteps<=1) return '';
  let nodes = '';
  for(let i=0;i<totalSteps;i++){
    const state = i<currentIndex? 'done' : (i===currentIndex? 'current' : 'upcoming');
    const circleClass = state==='done'? 'bg-ok text-white' : state==='current'? 'bg-tigo-600 text-white ring-4 ring-tigo-600/20' : 'bg-slate-200 text-slate-400';
    nodes += `<div class="flex items-center ${i>0?'flex-1':''}">
      ${i>0? `<div class="flex-1 h-0.5 ${i<=currentIndex? 'bg-ok':'bg-slate-200'}"></div>` : ''}
      <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-display font-bold shrink-0 ${circleClass}">${state==='done'?'✓':i+1}</div>
    </div>`;
  }
  return `<div class="flex items-center mb-6 px-2">${nodes}</div>`;
}
function renderCasePlayer(user, m){
  PLAYER_STATE.stepIndex = 0; PLAYER_STATE.cleanSteps = 0; PLAYER_STATE.totalSteps = (m.content.steps||[]).length;
  PLAYER_STATE.stepsLog = []; PLAYER_STATE.currentStepMistakes = [];

      <p class="text-slate-700">${escapeHTML(m.content.intro||'')}</p>

}
function renderCaseStep(){
  const m = DB.modules.find(m=>m.id===PLAYER_STATE.moduleId);
  const steps = m.content.steps || [];
  const i = PLAYER_STATE.stepIndex;
  if(i >= steps.length){ return finalizeCase(m); }
  PLAYER_STATE.currentStepMistakes = [];

}
function answerCaseOption(oi){
  const m = DB.modules.find(m=>m.id===PLAYER_STATE.moduleId);
  const step = m.content.steps[PLAYER_STATE.stepIndex];
  const opt = step.options[oi];
  const btn = document.getElementById('case-op-'+oi);
  if(opt.isCorrect){
    // Correcta: se cierra en verde, se deshabilitan todas y se habilita continuar al siguiente paso del mapa.
    document.querySelectorAll('#case-options .op-btn').forEach(b=>b.classList.add('disabled'));
    btn.classList.add('correct');
    PLAYER_STATE.stepsLog.push({ situation: step.situation, mistakes: PLAYER_STATE.currentStepMistakes, correctText: opt.text });
    if(PLAYER_STATE.currentStepMistakes.length===0) PLAYER_STATE.cleanSteps++;
    const nextBtn = document.createElement('button');
    nextBtn.className = 'btn btn-primary px-6 py-2.5 rounded-full mt-5';
    nextBtn.textContent = 'Continuar →';
    nextBtn.onclick = nextCaseStep;
    document.getElementById('player-body').querySelector('.card').appendChild(nextBtn);
  } else {
    // Incorrecta: se cierra en rojo, queda deshabilitada, y se muestra la observación de por qué no es correcta.
    btn.classList.add('incorrect','disabled');
    const obs = document.createElement('p');
    obs.className = 'text-xs text-bad mt-1 px-1';
    obs.textContent = '❌ ' + (opt.observation || 'Esta opción no es la más adecuada para este caso.');
    btn.insertAdjacentElement('afterend', obs);
    PLAYER_STATE.currentStepMistakes.push({ text: opt.text, observation: opt.observation||'' });
  }
}

   21) COMPETENCIA EN VIVO — juego multijugador tipo trivia por tiempo
   Independiente de los módulos normales: no afecta el avance/score general
   del asesor, queda solo en su propio historial de competencias. Requiere
   la nube (Firebase) activada, porque necesita sincronización en vivo real
   entre el celular del entrenador/a y los de todos los asesores conectados.
   Solo la wave del entrenador/a que la creó puede unirse (no es global).
   ========================================================================== */
let LIVEQUIZ_STATE = {}; // estado local de la sesión de competencia activa (host o participante)

function liveQuizDocRef(quizId){ return firestoreDB.collection('liveQuizzes').doc(quizId); }
function liveQuizParticipantsRef(quizId){ return liveQuizDocRef(quizId).collection('participants'); }
function generateJoinCode(){ return String(Math.floor(100000 + Math.random()*900000)); } // 6 dígitos

function unsubscribeLiveQuizListeners(){
  if(unsubActiveLiveQuiz){ unsubActiveLiveQuiz(); unsubActiveLiveQuiz = null; }
  if(unsubActiveLiveQuizParticipants){ unsubActiveLiveQuizParticipants(); unsubActiveLiveQuizParticipants = null; }
}

/** Calcula puntos de una respuesta: 0 si es incorrecta; si es correcta, entre 500 (al límite del tiempo) y 1000 (instantánea). */
function computeAnswerPoints(isCorrect, timeMs, timeLimitSec){
  if(!isCorrect) return 0;
  const limitMs = Math.max(1000, timeLimitSec*1000);
  const fraction = Math.max(0, Math.min(1, (limitMs - timeMs) / limitMs));
  return Math.round(500 + 500*fraction);
}

function competenciaQuestionRowHTML(q,i){
  return `
  <div class="card p-4" data-cqrow="${i}">

      <p class="text-xs font-display font-semibold text-tigo-700">Pregunta ${i+1}</p>

    <div class="flex flex-wrap gap-3 mb-3">
      <div>
        <label class="text-[11px] font-semibold text-slate-500">Tipo</label>

          <option value="mcq" ${q.type!=='tf'?'selected':''}>Opción múltiple</option>
          <option value="tf" ${q.type==='tf'?'selected':''}>Verdadero / Falso</option>
        </select>
      </div>
      <div>
        <label class="text-[11px] font-semibold text-slate-500">Tiempo (segundos)</label>
        <input type="number" min="5" max="300" class="field text-sm py-1.5 cq-time w-24" value="${q.timeLimitSec||60}">
      </div>
    </div>
    <div class="space-y-2 cq-options">
      ${(q.options||['','','','']).map((op,oi)=>`
        <div class="flex items-center gap-2">
          <input type="radio" name="cq-correct-${i}" class="cq-correct" ${q.correctIndex===oi?'checked':''} ${q.type==='tf'&&oi>1?'class="hidden"':''}>
          <input class="field text-sm py-1.5 cq-op-text ${q.type==='tf'&&oi>1?'hidden':''}" placeholder="Opción ${oi+1}" value="${escapeHTML(op||(q.type==='tf'?(oi===0?'Verdadero':'Falso'):''))}" ${q.type==='tf'?'readonly':''}>
        </div>`).join('')}
    </div>
