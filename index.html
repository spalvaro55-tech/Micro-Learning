}
function addCompetenciaQuestion(){
  collectCompetenciaQuestionsFromDOM(); // conserva lo que ya se escribió en las preguntas existentes antes de agregar una nueva
  LIVEQUIZ_STATE.draftQuestions.push({ text:'', type:'mcq', options:['','','',''], correctIndex:0, timeLimitSec:60 });
  document.getElementById('cq-list').innerHTML = LIVEQUIZ_STATE.draftQuestions.map((q,i)=>competenciaQuestionRowHTML(q,i)).join('');
}
function removeCompetenciaQuestion(i){
  collectCompetenciaQuestionsFromDOM();
  LIVEQUIZ_STATE.draftQuestions.splice(i,1);
  document.getElementById('cq-list').innerHTML = LIVEQUIZ_STATE.draftQuestions.map((q,i)=>competenciaQuestionRowHTML(q,i)).join('');
}
function changeCompetenciaQuestionType(i, newType){
  collectCompetenciaQuestionsFromDOM();
  const q = LIVEQUIZ_STATE.draftQuestions[i];
  q.type = newType;
  q.options = newType==='tf'? ['Verdadero','Falso'] : ['','','',''];
  q.correctIndex = 0;
  document.getElementById('cq-list').innerHTML = LIVEQUIZ_STATE.draftQuestions.map((q,i)=>competenciaQuestionRowHTML(q,i)).join('');
}
function collectCompetenciaQuestionsFromDOM(){
  const rows = document.querySelectorAll('#cq-list [data-cqrow]');
  rows.forEach((row,i)=>{
    const q = LIVEQUIZ_STATE.draftQuestions[i];
    if(!q) return;
    q.text = row.querySelector('.cq-text').value.trim();
    q.timeLimitSec = Number(row.querySelector('.cq-time').value)||60;
    const optionEls = [...row.querySelectorAll('.cq-op-text')];
    q.options = optionEls.map(el=>el.value.trim());
    const correctEl = row.querySelector('.cq-correct:checked');
    q.correctIndex = correctEl? [...row.querySelectorAll('.cq-correct')].indexOf(correctEl) : 0;
  });
}
/** Valida y recolecta título+preguntas desde el editor. Devuelve null (y avisa) si algo falta. */
function validateAndCollectCompetenciaDraft(){
  collectCompetenciaQuestionsFromDOM();
  const title = document.getElementById('cq-title').value.trim();
  const questions = LIVEQUIZ_STATE.draftQuestions;
  if(!title){ toast('Ponle un nombre a la competencia', 'warn'); return null; }
  if(!questions.length){ toast('Agrega al menos una pregunta', 'warn'); return null; }
  if(questions.some(q=>!q.text.trim())){ toast('Todas las preguntas necesitan texto', 'warn'); return null; }
  return { title, questions };
}
/** Guarda (crea o actualiza) el banco de preguntas como plantilla reutilizable, SIN lanzar ninguna sala todavía. */
function saveCompetenciaTemplate(){
  const draft = validateAndCollectCompetenciaDraft();
  if(!draft) return;
  const country = SESSION.country, trainer = findTrainer(country, SESSION.trainerId);
  if(LIVEQUIZ_STATE.editingTemplateId){
    const existing = DB.liveQuizTemplates.find(t=>t.id===LIVEQUIZ_STATE.editingTemplateId);
    if(existing){
      existing.title = draft.title; existing.questions = draft.questions; existing.updatedAt = Date.now();
      persist(); toast('Competencia actualizada', 'ok'); navigate('trainerHome',{tab:'competencia'}); return;
    }
  }
  const template = { id: uid('lqt'), country, trainerId: trainer.id, trainerName: trainer.name, title: draft.title, questions: draft.questions, createdAt: Date.now(), updatedAt: Date.now() };
  DB.liveQuizTemplates.push(template);
  persist();
  toast('Competencia guardada. Podrás reutilizarla cuando quieras.', 'ok');
  navigate('trainerHome',{tab:'competencia'});
}
function confirmDeleteCompetenciaTemplate(id){

/* ---- Pantalla del Entrenador/a (host): sala de espera → pregunta en vivo → resultados ---- */
function renderCompetenciaHost(){
  const quizId = SESSION.params.quizId;
  unsubscribeLiveQuizListeners();
  LIVEQUIZ_STATE = { quizId, participants: [] };
  $app.innerHTML = `<div class="flex-1 flex items-center justify-center"><p class="text-slate-400 text-sm">Cargando sala...</p></div>`;
  unsubActiveLiveQuiz = liveQuizDocRef(quizId).onSnapshot(snap=>{
    if(!snap.exists) return;
    LIVEQUIZ_STATE.quiz = snap.data();
    renderCompetenciaHostBody();
  }, err=>{ console.error('Error de sincronización de la competencia:', err); });
  unsubActiveLiveQuizParticipants = liveQuizParticipantsRef(quizId).onSnapshot(snap=>{
    LIVEQUIZ_STATE.participants = snap.docs.map(d=>d.data());
    renderCompetenciaHostBody();
  }, err=>{ console.error('Error de sincronización de participantes:', err); });
}
function renderCompetenciaHostBody(){
  const quiz = LIVEQUIZ_STATE.quiz;
  if(!quiz) return;
  const participants = LIVEQUIZ_STATE.participants || [];
  let bodyHTML = '';
  if(quiz.status==='lobby'){
    bodyHTML = `
    <div class="card p-8 text-center">
      <p class="text-xs font-display font-semibold text-tigo-600 uppercase tracking-wide mb-2">Código para unirse</p>

    </div>
    <div class="card p-6 mt-5">
      <p class="font-display font-semibold text-tigo-900 text-sm mb-3">Asesores conectados (${participants.length})</p>
      <div class="flex flex-wrap gap-2">
        ${participants.length? participants.map(p=>`<span class="chip bg-tigo-700/10 text-tigo-700">${escapeHTML(p.nombre)} ${escapeHTML(p.apellido)}</span>`).join('') : '<p class="text-sm text-slate-400">Esperando a que se unan...</p>'}
      </div>
    </div>
    <button class="btn btn-primary w-full py-3 rounded-full mt-5" ${participants.length===0?'disabled':''} onclick="startCompetencia()">Iniciar competencia (${participants.length} unidos) →</button>`;
  } else if(quiz.status==='question' || quiz.status==='question_ended'){
    const q = quiz.questions[quiz.currentQuestionIndex];
    const answeredCount = participants.filter(p=>p.answers && p.answers.some(a=>a.questionIndex===quiz.currentQuestionIndex)).length;
    bodyHTML = `
    <div class="card p-6 text-center">
      <p class="text-xs text-slate-400 mb-1">Pregunta ${quiz.currentQuestionIndex+1} de ${quiz.questions.length}</p>
      <p class="font-display font-bold text-tigo-900 text-xl">${escapeHTML(q.text)}</p>
      <div class="grid ${q.type==='tf'?'grid-cols-2':'grid-cols-2'} gap-2 mt-4 max-w-md mx-auto">
        ${q.options.map((op,oi)=>`<div class="p-3 rounded-lg border ${oi===q.correctIndex && quiz.status==='question_ended'?'border-ok bg-ok/10':'border-slate-200'} text-sm">${escapeHTML(op)}</div>`).join('')}
      </div>
      <p class="text-sm text-slate-500 mt-4">${answeredCount} de ${participants.length} ya respondieron</p>
      <button class="btn btn-primary px-6 py-3 rounded-full mt-4" onclick="nextCompetenciaQuestion()">${quiz.currentQuestionIndex+1>=quiz.questions.length? 'Ver resultados finales →':'Siguiente pregunta →'}</button>
    </div>`;
  } else if(quiz.status==='finished'){
    const sorted = participants.slice().sort((a,b)=>b.totalScore-a.totalScore);
    bodyHTML = `
    <div class="card p-8">
      <p class="font-display font-bold text-tigo-900 text-xl text-center mb-5">🏁 ¡Competencia terminada!</p>
      ${podiumHTML(sorted)}
      <div class="overflow-x-auto mt-6">
        <table class="w-full text-sm">
          <thead><tr class="text-left text-slate-400 border-b border-slate-100"><th class="py-2 pr-4">#</th><th class="py-2 pr-4">Asesor</th><th class="py-2 pr-4">Puntos</th></tr></thead>
          <tbody>${sorted.map((p,i)=>`<tr class="border-b border-slate-50"><td class="py-2 pr-4 text-slate-400">${i+1}</td><td class="py-2 pr-4 font-medium text-slate-700">${escapeHTML(p.nombre)} ${escapeHTML(p.apellido)}</td><td class="py-2 pr-4 font-semibold text-tigo-700">${p.totalScore} pts</td></tr>`).join('')}</tbody>
        </table>
      </div>
      <button class="btn btn-primary w-full py-3 rounded-full mt-6" onclick="unsubscribeLiveQuizListeners(); navigate('trainerHome',{tab:'competencia'})">Volver a Competencia</button>
    </div>`;
  }
  $app.innerHTML = `
  <div class="flex-1 flex flex-col">
    <header class="bg-tigo-700"><div class="max-w-2xl mx-auto px-5 py-4 flex items-center justify-between">
      <button class="text-sm text-white/80 hover:text-white" onclick="unsubscribeLiveQuizListeners(); navigate('trainerHome',{tab:'competencia'})">← Salir</button>
      <span class="chip bg-white/15 text-white">🏆 ${escapeHTML(quiz.title)}</span>
    </div></header>
    <main class="flex-1 max-w-2xl w-full mx-auto px-5 py-8">${bodyHTML}</main>
  </div>
  ${footerHTML()}`;
}
async function startCompetencia(){
  const quiz = LIVEQUIZ_STATE.quiz;
  await liveQuizDocRef(quiz.id).update({ status:'question', currentQuestionIndex:0, currentQuestionStartedAt: Date.now(), startedAt: Date.now() });
}
async function nextCompetenciaQuestion(){
  const quiz = LIVEQUIZ_STATE.quiz;
  const nextIdx = quiz.currentQuestionIndex+1;
  if(nextIdx >= quiz.questions.length){
    await finishCompetencia();
    return;
  }
  await liveQuizDocRef(quiz.id).update({ status:'question', currentQuestionIndex: nextIdx, currentQuestionStartedAt: Date.now() });
}
async function finishCompetencia(){
  const quiz = LIVEQUIZ_STATE.quiz;
  const participants = LIVEQUIZ_STATE.participants || [];
  await liveQuizDocRef(quiz.id).update({ status:'finished', finishedAt: Date.now() });
  const entry = {
    id: uid('lqh'), country: quiz.country, trainerId: quiz.trainerId, trainerName: quiz.trainerName,
    title: quiz.title, questionsCount: quiz.questions.length, finishedAt: Date.now(),
    participants: participants.map(p=>({ userId:p.userId, nombre:p.nombre, apellido:p.apellido, colaboradorId:p.colaboradorId, totalScore:p.totalScore||0 }))
  };
  DB.liveQuizHistory.push(entry);
  persistLiveQuizHistoryEntry(entry);
}

      <p id="join-code-error" class="text-bad text-xs mt-2 hidden"></p>

async function joinCompetenciaByCode(){
  const user = currentUser();
  const code = document.getElementById('join-code').value.trim();
  const errEl = document.getElementById('join-code-error');
  if(!FIREBASE_ENABLED || !liveQuizzesCollRef){ errEl.textContent='Esta función necesita conexión a la nube.'; errEl.classList.remove('hidden'); return; }
  try{
    const snap = await liveQuizzesCollRef.where('code','==',code).where('country','==',user.country).where('trainerId','==',user.trainerId).limit(1).get();
    if(snap.empty){ errEl.textContent='Código inválido o no corresponde a tu entrenador/a.'; errEl.classList.remove('hidden'); return; }
    const quiz = snap.docs[0].data();
    if(quiz.status==='finished'){ errEl.textContent='Esta competencia ya terminó.'; errEl.classList.remove('hidden'); return; }
    await liveQuizParticipantsRef(quiz.id).doc(user.id).set({
      userId:user.id, nombre:user.nombre, apellido:user.apellido, colaboradorId:user.colaboradorId,
      joinedAt: Date.now(), totalScore:0, answers:[]
    });
    navigate('competenciaPlay', { quizId: quiz.id });
  }catch(e){ console.error(e); errEl.textContent='No se pudo unir. Intenta de nuevo.'; errEl.classList.remove('hidden'); }
}

  const user = currentUser();

  unsubscribeLiveQuizListeners();

  $app.innerHTML = `<div class="flex-1 flex items-center justify-center"><p class="text-slate-400 text-sm">Conectando...</p></div>`;
  unsubActiveLiveQuiz = liveQuizDocRef(quizId).onSnapshot(snap=>{
    if(!snap.exists) return;
    LIVEQUIZ_STATE.quiz = snap.data();
    renderCompetenciaPlayBody();
  }, err=>{ console.error('Error de sincronización de la competencia:', err); });
}
function renderCompetenciaPlayBody(){
  const quiz = LIVEQUIZ_STATE.quiz;
  const user = currentUser();
  if(!quiz || !user) return;
  let bodyHTML = '';
  if(quiz.status==='lobby'){
    bodyHTML = `<div class="card p-8 text-center"><p class="text-4xl mb-3">⏳</p><p class="font-display font-bold text-tigo-900">Esperando a que tu entrenador/a inicie...</p><p class="text-sm text-slate-500 mt-1">${escapeHTML(quiz.title)}</p></div>`;
  } else if(quiz.status==='question' || quiz.status==='question_ended'){
    const q = quiz.questions[quiz.currentQuestionIndex];
    const already = LIVEQUIZ_STATE.answeredIndex===quiz.currentQuestionIndex;
    if(quiz.status==='question_ended' || already){
      const wasCorrect = LIVEQUIZ_STATE.lastWasCorrect;
      bodyHTML = `<div class="card p-8 text-center">
        <p class="text-4xl mb-3">${already? (wasCorrect?'✅':'❌') : '⏱'}</p>
        <p class="font-display font-bold text-tigo-900">${already? (wasCorrect? '¡Correcto!':'No era esa...') : 'Esperando al resto...'}</p>
        <p class="text-sm text-slate-500 mt-1">Esperando a que tu entrenador/a avance a la siguiente pregunta.</p>
      </div>`;
    } else {
      bodyHTML = `
      <div class="card p-6">
        <div class="flex items-center justify-between mb-3">
          <p class="text-xs text-slate-400">Pregunta ${quiz.currentQuestionIndex+1} de ${quiz.questions.length}</p>
          <span id="cq-play-timer" class="chip bg-bad/10 text-bad">⏱ --</span>
        </div>
        <p class="font-display font-semibold text-tigo-900 text-lg mb-4">${escapeHTML(q.text)}</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2" id="cq-play-options">
          ${q.options.map((op,oi)=>`<button class="op-btn w-full py-4" onclick="submitCompetenciaAnswer(${oi})">${escapeHTML(op)}</button>`).join('')}
        </div>
      </div>`;
    }
  } else if(quiz.status==='finished'){
    bodyHTML = `<div class="card p-8 text-center"><p class="text-4xl mb-3">🏁</p><p class="font-display font-bold text-tigo-900">¡Competencia terminada!</p><p class="text-sm text-slate-500 mt-1">Pídele a tu entrenador/a los resultados finales.</p>
      <button class="btn btn-primary px-6 py-2.5 rounded-full mt-5" onclick="unsubscribeLiveQuizListeners(); navigate('userHome')">Volver a mi ruta</button>
    </div>`;
  }
  $app.innerHTML = `
  <div class="flex-1 flex flex-col">
    <header class="bg-tigo-700"><div class="max-w-lg mx-auto px-5 py-4"><span class="chip bg-white/15 text-white">🏆 ${escapeHTML(quiz.title)}</span></div></header>
    <main class="flex-1 max-w-lg w-full mx-auto px-5 py-8">${bodyHTML}</main>
  </div>
  ${footerHTML()}`;
  if(quiz.status==='question' && LIVEQUIZ_STATE.answeredIndex!==quiz.currentQuestionIndex){
    startCompetenciaPlayTimer(quiz);
  }
}
function startCompetenciaPlayTimer(quiz){
  const q = quiz.questions[quiz.currentQuestionIndex];
  clearInterval(LIVEQUIZ_STATE.timerInterval);
  const tick = ()=>{
    const el = document.getElementById('cq-play-timer');
    if(!el){ clearInterval(LIVEQUIZ_STATE.timerInterval); return; }
    const remainingMs = (quiz.currentQuestionStartedAt + q.timeLimitSec*1000) - Date.now();
    if(remainingMs<=0){ el.textContent='⏱ 0s'; clearInterval(LIVEQUIZ_STATE.timerInterval); return; }
    el.textContent = '⏱ ' + Math.ceil(remainingMs/1000) + 's';
  };
  tick();
  LIVEQUIZ_STATE.timerInterval = setInterval(tick, 250);
}
async function submitCompetenciaAnswer(selectedIndex){
  const quiz = LIVEQUIZ_STATE.quiz;
  const user = currentUser();
  clearInterval(LIVEQUIZ_STATE.timerInterval);
  const q = quiz.questions[quiz.currentQuestionIndex];
  const timeMs = Math.max(0, Date.now() - quiz.currentQuestionStartedAt);
  const isCorrect = selectedIndex===q.correctIndex;
  const points = computeAnswerPoints(isCorrect, timeMs, q.timeLimitSec);
  LIVEQUIZ_STATE.answeredIndex = quiz.currentQuestionIndex;
  LIVEQUIZ_STATE.lastWasCorrect = isCorrect;
  try{
    const partRef = liveQuizParticipantsRef(quiz.id).doc(user.id);
    const snap = await partRef.get();
    const data = snap.exists? snap.data() : { userId:user.id, nombre:user.nombre, apellido:user.apellido, colaboradorId:user.colaboradorId, totalScore:0, answers:[] };
    data.answers = data.answers||[];
    data.answers.push({ questionIndex: quiz.currentQuestionIndex, selectedIndex, isCorrect, timeMs, points });
    data.totalScore = (data.totalScore||0) + points;
    await partRef.set(data);
  }catch(e){ console.error('No se pudo enviar la respuesta:', e); }
  renderCompetenciaPlayBody();
}

/* ==========================================================================
   22) INICIALIZACIÓN
   ========================================================================== */
initApp();
</script>
